schema_version: schema_v1
generator_version: dpb-1.0.0
sensor:
  fov_x_mm: [-700.0, 100.0]
  sample_hz: 100.0
  latency_s: 0.020
  timestamp_jitter_s: 0.010
  pos_sigma_mm: 0.10
  ang_sigma_deg: 0.30
  quant_mm: 0.01
  quant_deg: 0.01
  drop_prob: 0.01
  outlier_prob: 0.002
  outlier_pos_mm: 0.5
  outlier_ang_deg: 2.0
scenarios:
  sensor_hard: {pos_sigma_mm: 0.5, drop_prob: 0.05, outlier_prob: 0.01}
robot:
  home_x_mm: 0.0
  home_y_nominal_mm: 95.0
  home_z_nominal_mm: 40.0
  home_y_offset_mm: 250.0
  speed_mm_s: 200.0
  comm_delay_s: 0.5
  envelope_x_mm: [-300.0, 300.0]
  envelope_y_mm: [0.0, 500.0]
  envelope_z_mm: [-100.0, 300.0]
planner:
  strategy: two_command     # two_command | single_command | adaptive
  single_entry_x_mm: -150.0
  single_horizon_s: 2.2
  horizon_max_s: 9.8
  horizon_min_s: 2.0
  cadence_factor: 0.85
  default_cadence_s: 12.9
  correction_lead_s: 2.0
  min_history_s: 0.8
  replan_interval_s: 0.05
  issue_settle_s: 0.0
  event_residual_threshold_mm_s: 3.0
  reachability_safety: 0.9
predictor:
  variant: b3
  velocity_window_s: 2.0
  velocity_min_frames: 4
  shared_weight: 1.0
  global_window_s: 3.0
  global_weight: 0.0
  global_accel_kappa: 0.5
  use_attitude_decorrelation: true
  yaw_lever_mm: 95.0
  accel_window_s: 1.5
  accel_kappa: 0.0
  accel_cap_mm_s2: 25.0
  accel_cap_correction_mm: 30.0
  event_accel_kappa: 0.0
  event_accel_threshold: 8.0
  b4_ridge_weight: 0.5
  b4_ridge_lambda: 1.0
  b4_window_s: 6.0
  ou_lag_s: 0.20
  tau_min_s: 0.30
  tau_max_s: 3.0
  history_s: 12.0
  outlier_mad_factor: 4.0
  sigma_floor_pos_mm: 0.15
  sigma_floor_ang_deg: 0.20
sim:
  dt_s: 0.05
  causal_cut_s: 100.0
eval:
  thresholds:
    - {pos_mm: 3.0, ang_deg: 2.0, name: "3mm2deg"}
    - {pos_mm: 5.0, ang_deg: 3.0, name: "5mm3deg"}
    - {pos_mm: 10.0, ang_deg: 5.0, name: "10mm5deg"}
    - {pos_mm: 20.0, ang_deg: 8.0, name: "20mm8deg"}
  main: {pos_mm: 10.0, ang_deg: 5.0}
  time_tolerance_s: 0.5
  monte_carlo_samples: 200000
